<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar · Central de Performance</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  background: #0f4c81;
}

/* Animação de fundo flutuante */
.bg-animation {
  position: fixed;
  top: 0; left: 0; width: 100%; height: 100%;
  z-index: 0;
  background: linear-gradient(135deg, #0f4c81 0%, #1e88e5 50%, #0d47a1 100%);
}
.bg-animation .orb {
  position: absolute;
  border-radius: 50%;
  filter: blur(60px);
  opacity: 0.5;
  animation: float 8s ease-in-out infinite;
}
.bg-animation .orb:nth-child(1) {
  width: 400px; height: 400px;
  background: #42a5f5;
  top: -100px; left: -100px;
  animation-delay: 0s;
}
.bg-animation .orb:nth-child(2) {
  width: 300px; height: 300px;
  background: #64b5f6;
  bottom: -50px; right: -50px;
  animation-delay: 2s;
}
.bg-animation .orb:nth-child(3) {
  width: 250px; height: 250px;
  background: #90caf9;
  top: 50%; left: 60%;
  animation-delay: 4s;
}
@keyframes float {
  0%, 100% { transform: translate(0, 0) scale(1); }
  33% { transform: translate(30px, -30px) scale(1.1); }
  66% { transform: translate(-20px, 20px) scale(0.9); }
}

/* Card de login */
.login-card {
  position: relative;
  z-index: 1;
  background: rgba(255,255,255,0.95);
  backdrop-filter: blur(20px);
  padding: 48px 40px;
  border-radius: 24px;
  width: 100%;
  max-width: 420px;
  box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
  animation: slideUp 0.6s ease-out;
}
@keyframes slideUp {
  from { opacity: 0; transform: translateY(30px); }
  to { opacity: 1; transform: translateY(0); }
}

.login-card h1 {
  font-size: 32px;
  font-weight: 300;
  color: #1565c0;
  margin-bottom: 8px;
}
.login-card .subtitle {
  font-size: 13px;
  color: #64b5f6;
  margin-bottom: 32px;
}
.login-card .subtitle a {
  color: #1565c0;
  text-decoration: none;
  font-weight: 500;
}
.login-card .subtitle a:hover { text-decoration: underline; }

.input-group {
  position: relative;
  margin-bottom: 20px;
}
.input-group input {
  width: 100%;
  padding: 14px 16px 14px 44px;
  border: 1.5px solid #e3f2fd;
  border-radius: 12px;
  font-size: 15px;
  background: #fafafa;
  color: #333;
  transition: all 0.3s;
}
.input-group input:focus {
  outline: none;
  border-color: #42a5f5;
  background: #fff;
  box-shadow: 0 0 0 3px rgba(66,165,245,0.15);
}
.input-group .icon {
  position: absolute;
  left: 16px;
  top: 50%;
  transform: translateY(-50%);
  color: #90caf9;
  font-size: 16px;
}

.options {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 24px;
  font-size: 13px;
}
.options label {
  display: flex;
  align-items: center;
  gap: 6px;
  color: #666;
  cursor: pointer;
}
.options label input { accent-color: #1565c0; }
.options a {
  color: #42a5f5;
  text-decoration: none;
}
.options a:hover { color: #1565c0; }

.btn-signin {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 12px;
  background: linear-gradient(135deg, #42a5f5 0%, #1565c0 100%);
  color: #fff;
  font-size: 16px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.3s;
  box-shadow: 0 4px 15px rgba(21,101,192,0.3);
}
.btn-signin:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 25px rgba(21,101,192,0.4);
}
.btn-signin:active { transform: translateY(0); }

.msg {
  margin-top: 16px;
  padding: 12px;
  border-radius: 8px;
  font-size: 13px;
  text-align: center;
  display: none;
}
.msg.error { background: #ffebee; color: #c62828; display: block; }
.msg.success { background: #e8f5e9; color: #2e7d32; display: block; }
.msg.info { background: #e3f2fd; color: #1565c0; display: block; }

/* Tela de aguardando aprovação */
.pending-screen {
  display: none;
  text-align: center;
}
.pending-screen .icon-clock {
  font-size: 64px;
  color: #42a5f5;
  margin-bottom: 20px;
  animation: pulse 2s infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}
.pending-screen h2 {
  font-size: 22px;
  color: #1565c0;
  margin-bottom: 12px;
}
.pending-screen p {
  color: #666;
  font-size: 14px;
  line-height: 1.6;
}
</style>
</head>
<body>

<div class="bg-animation">
  <div class="orb"></div>
  <div class="orb"></div>
  <div class="orb"></div>
</div>

<div class="login-card" id="loginForm">
  <h1>Sign in</h1>
  <p class="subtitle">Not registered? <a href="#" onclick="return false;">Click here to register.</a></p>
  
  <div class="input-group">
    <span class="icon">&#128100;</span>
    <input type="text" id="usuario" placeholder="Username" autocomplete="username">
  </div>
  
  <div class="input-group">
    <span class="icon">&#128274;</span>
    <input type="password" id="senha" placeholder="Password" autocomplete="current-password">
  </div>
  
  <div class="options">
    <label><input type="checkbox" id="remember"> Remember Me</label>
    <a href="#">Forgot Password?</a>
  </div>
  
  <button class="btn-signin" onclick="fazerLogin()">Sign in</button>
  <div class="msg" id="msg"></div>
</div>

<div class="login-card pending-screen" id="pendingScreen">
  <div class="icon-clock">&#9201;</div>
  <h2>Aguardando Aprovação</h2>
  <p>Seu primeiro acesso foi registrado.<br>Um administrador precisa liberar seu perfil de acesso.<br><br><strong>Entre em contato com o setor de TI.</strong></p>
  <br>
  <button class="btn-signin" onclick="voltarLogin()">Voltar</button>
</div>

<script>
// ===== CONFIGURAÇÃO DE USUÁRIOS =====
const ADMINS = ['rafael.pieretti', 'caroline.queiroz'];
const TIPOS_ACESSO = {
  ADMIN: 'admin',      // pode tudo + aprovar usuários
  GERAL: 'geral',      // vê todos os setores
  INDIVIDUAL: 'individual'  // vê apenas seu usuário
};

// ===== GERENCIAMENTO DE USUÁRIOS =====
function getUsuarios() {
  return JSON.parse(localStorage.getItem('gcm_usuarios') || '{}');
}
function setUsuarios(usuarios) {
  localStorage.setItem('gcm_usuarios', JSON.stringify(usuarios));
}
function getUsuarioLogado() {
  return JSON.parse(localStorage.getItem('gcm_usuario_logado') || 'null');
}

// Inicializa admins no sistema
function initSistema() {
  const usuarios = getUsuarios();
  ADMINS.forEach(admin => {
    if (!usuarios[admin]) {
      usuarios[admin] = { tipo: TIPOS_ACESSO.ADMIN, aprovado: true, nome: admin };
    }
  });
  setUsuarios(usuarios);
}
initSistema();

async function fazerLogin() {
  const usuario = document.getElementById('usuario').value.trim().toLowerCase();
  const senha = document.getElementById('senha').value;
  const msg = document.getElementById('msg');
  
  if (!usuario || !senha) {
    msg.className = 'msg error';
    msg.textContent = 'Preencha usuário e senha.';
    return;
  }
  
  msg.className = 'msg info';
  msg.textContent = 'Autenticando...';
  
  try {
    // Chama a function Netlify senior-login
    const res = await fetch('/.netlify/functions/senior-login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ usuario, senha })
    });
    const data = await res.json();
    
    if (!data.autenticado) {
      msg.className = 'msg error';
      msg.textContent = data.mensagem || 'Credenciais inválidas.';
      return;
    }
    
    // Verifica se já existe no sistema local
    const usuarios = getUsuarios();
    
    if (!usuarios[usuario]) {
      // Primeiro acesso — cria como pendente
      usuarios[usuario] = {
        tipo: null,
        aprovado: false,
        nome: data.email || usuario,
        email: data.email || usuario,
        primeiroAcesso: new Date().toISOString()
      };
      setUsuarios(usuarios);
      
      // Mostra tela de aguardando aprovação
      document.getElementById('loginForm').style.display = 'none';
      document.getElementById('pendingScreen').style.display = 'block';
      return;
    }
    
    if (!usuarios[usuario].aprovado) {
      document.getElementById('loginForm').style.display = 'none';
      document.getElementById('pendingScreen').style.display = 'block';
      return;
    }
    
    // Login aprovado
    const userData = {
      usuario: usuario,
      nome: usuarios[usuario].nome,
      email: usuarios[usuario].email,
      tipo: usuarios[usuario].tipo,
      autenticado: true
    };
    localStorage.setItem('gcm_usuario_logado', JSON.stringify(userData));
    
    msg.className = 'msg success';
    msg.textContent = 'Login realizado! Redirecionando...';
    setTimeout(() => window.location.href = 'index.html', 800);
    
  } catch (err) {
    msg.className = 'msg error';
    msg.textContent = 'Erro de conexão. Tente novamente.';
    console.error(err);
  }
}

function voltarLogin() {
  document.getElementById('loginForm').style.display = 'block';
  document.getElementById('pendingScreen').style.display = 'none';
  document.getElementById('usuario').value = '';
  document.getElementById('senha').value = '';
  document.getElementById('msg').style.display = 'none';
}

// Enter para logar
document.getElementById('senha').addEventListener('keypress', e => {
  if (e.key === 'Enter') fazerLogin();
});
</script>

</body>
</html>
