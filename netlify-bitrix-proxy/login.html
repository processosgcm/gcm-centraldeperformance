<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  background: #050d1a;
}

/* ===== FUNDO ANIMADO ===== */
.bg-animated {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 0;
  background: linear-gradient(-45deg, #020617, #0a1628, #003E73, #0063B3, #3B8FD1, #0a1628, #020617);
  background-size: 600% 600%;
  animation: gradientFlow 10s ease infinite;
}
@keyframes gradientFlow {
  0% { background-position: 0% 50%; }
  25% { background-position: 50% 100%; }
  50% { background-position: 100% 50%; }
  75% { background-position: 50% 0%; }
  100% { background-position: 0% 50%; }
}

/* Orbs flutuantes */
.orb {
  position: absolute;
  border-radius: 50%;
  filter: blur(70px);
  pointer-events: none;
}
.orb-1 { width: 500px; height: 500px; background: rgba(66,165,245,0.4); top: -150px; left: -100px; animation: float1 8s ease-in-out infinite; }
.orb-2 { width: 400px; height: 400px; background: rgba(100,181,246,0.35); bottom: -100px; right: -80px; animation: float2 10s ease-in-out infinite 1s; }
.orb-3 { width: 350px; height: 350px; background: rgba(144,202,249,0.25); top: 30%; left: 60%; animation: float3 7s ease-in-out infinite 2s; }
.orb-4 { width: 250px; height: 250px; background: rgba(30,136,229,0.3); top: 10%; right: 25%; animation: float4 9s ease-in-out infinite 0.5s; }
.orb-5 { width: 320px; height: 320px; background: rgba(66,165,245,0.2); bottom: 20%; left: 30%; animation: float5 11s ease-in-out infinite 3s; }
.orb-6 { width: 180px; height: 180px; background: rgba(100,181,246,0.35); top: 60%; right: 10%; animation: float6 6s ease-in-out infinite 1.5s; }

@keyframes float1 { 0%,100%{transform:translate(0,0) scale(1)} 33%{transform:translate(60px,-50px) scale(1.15)} 66%{transform:translate(-40px,30px) scale(0.9)} }
@keyframes float2 { 0%,100%{transform:translate(0,0) scale(1)} 33%{transform:translate(-50px,-40px) scale(1.1)} 66%{transform:translate(30px,25px) scale(1.05)} }
@keyframes float3 { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(-50px,40px) scale(1.12)} }
@keyframes float4 { 0%,100%{transform:translate(0,0) scale(1)} 33%{transform:translate(30px,-60px) scale(1.2)} 66%{transform:translate(-20px,20px) scale(0.95)} }
@keyframes float5 { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(40px,-30px) scale(1.08)} }
@keyframes float6 { 0%,100%{transform:translate(0,0) scale(1)} 33%{transform:translate(-30px,50px) scale(1.15)} 66%{transform:translate(20px,-20px) scale(0.9)} }

/* Canvas de partículas */
#particles {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 1;
  pointer-events: none;
}

/* ===== CARD ===== */
.card {
  position: relative;
  z-index: 2;
  background: rgba(255,255,255,0.96);
  backdrop-filter: blur(30px);
  padding: 48px 42px 42px;
  border-radius: 28px;
  width: 100%;
  max-width: 400px;
  margin: 20px;
  box-shadow: 0 30px 70px -15px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,255,255,0.2) inset;
  animation: cardEnter 0.8s cubic-bezier(0.22,1,0.36,1);
}
@keyframes cardEnter {
  from { opacity: 0; transform: translateY(50px) scale(0.95); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

.logo-wrap {
  display: flex;
  justify-content: center;
  margin-bottom: 28px;
}
.logo-wrap img {
  height: 58px;
  width: auto;
  transition: transform 0.3s;
}
.logo-wrap img:hover { transform: scale(1.04); }

.card h1 {
  font-size: 26px;
  font-weight: 700;
  color: #003E73;
  text-align: center;
  margin-bottom: 4px;
}
.card .subtitle {
  font-size: 13px;
  color: #90a4ae;
  text-align: center;
  margin-bottom: 32px;
}

/* Inputs sem ícone */
.field {
  position: relative;
  margin-bottom: 16px;
}
.field input {
  width: 100%;
  padding: 14px 18px;
  border: 1.5px solid #e8f0fe;
  border-radius: 12px;
  font-size: 15px;
  background: #f8fafc;
  color: #1a237e;
  transition: all 0.25s ease;
  outline: none;
}
.field input::placeholder { color: #b0bec5; }
.field input:focus {
  border-color: #3B8FD1;
  background: #fff;
  box-shadow: 0 0 0 4px rgba(66,165,245,0.12);
}
.field input.err {
  border-color: #DE001A;
  background: #fff5f5;
  animation: shake 0.4s ease;
}
@keyframes shake {
  0%,100%{transform:translateX(0)} 20%{transform:translateX(-6px)} 40%{transform:translateX(6px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(4px)}
}

.options {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 26px;
  font-size: 13px;
}
.options label {
  display: flex;
  align-items: center;
  gap: 7px;
  color: #607d8b;
  cursor: pointer;
  user-select: none;
}
.options label:hover { color: #0063B3; }
.options label input { width: 16px; height: 16px; accent-color: #0063B3; cursor: pointer; }
.options a {
  color: #3B8FD1;
  text-decoration: none;
  font-weight: 500;
  transition: color 0.2s;
}
.options a:hover { color: #003E73; text-decoration: underline; }

.status {
  text-align: center;
  font-size: 13px;
  color: #90a4ae;
  margin-bottom: 14px;
  min-height: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}
.status.ok { color: #00491B; }
.status-dot {
  display: inline-block;
  width: 7px; height: 7px;
  border-radius: 50%;
  background: #3B8FD1;
  animation: blink 1.2s ease-in-out infinite;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

.btn-primary {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 12px;
  background: linear-gradient(135deg, #3B8FD1 0%, #0063B3 100%);
  color: #fff;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s ease;
  box-shadow: 0 4px 16px rgba(21,101,192,0.28);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 28px rgba(21,101,192,0.38);
}
.btn-primary:active { transform: translateY(0); }
.btn-primary:disabled {
  opacity: 0.65;
  cursor: not-allowed;
  transform: none;
}
.spinner {
  display: inline-block;
  width: 18px; height: 18px;
  border: 2.5px solid rgba(255,255,255,0.35);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin 0.75s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.msg {
  margin-top: 16px;
  padding: 12px 16px;
  border-radius: 10px;
  font-size: 13px;
  text-align: center;
  display: none;
  animation: msgIn 0.35s ease;
  font-weight: 500;
}
@keyframes msgIn {
  from { opacity: 0; transform: translateY(-6px); }
  to { opacity: 1; transform: translateY(0); }
}
.msg.error { display: block; background: linear-gradient(135deg,#FBE1E4,#F5C2C8); color: #730010; border: 1px solid #E8A0A8; }
.msg.success { display: block; background: linear-gradient(135deg,#E3F5EA,#C7E8D2); color: #00491B; border: 1px solid #8FCBA0; }
.msg.info { display: block; background: linear-gradient(135deg,#EAF2FA,#CFE2F3); color: #0063B3; border: 1px solid #9FC6E8; }

/* Telas */
.screen { display: none; animation: screenIn 0.5s cubic-bezier(0.22,1,0.36,1); }
.screen.active { display: block; }
@keyframes screenIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.pending-icon {
  font-size: 56px;
  margin-bottom: 18px;
  text-align: center;
  animation: pulseIcon 2.5s ease-in-out infinite;
}
@keyframes pulseIcon {
  0%,100% { opacity: 0.85; transform: scale(1); }
  50% { opacity: 1; transform: scale(1.08); }
}
.pending-title {
  font-size: 22px;
  font-weight: 700;
  color: #0063B3;
  text-align: center;
  margin-bottom: 12px;
}
.pending-text {
  color: #607d8b;
  font-size: 14px;
  line-height: 1.7;
  text-align: center;
  margin-bottom: 28px;
}

.admin-bar {
  display: none;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 18px;
  padding-bottom: 14px;
  border-bottom: 1px solid #EAF2FA;
}
.admin-bar span { font-size: 13px; color: #546e7a; }
.admin-bar strong { color: #0063B3; }
.admin-title {
  font-size: 20px;
  font-weight: 700;
  color: #0063B3;
  text-align: center;
  margin-bottom: 4px;
}
.admin-sub {
  text-align: center;
  color: #90a4ae;
  font-size: 12px;
  margin-bottom: 18px;
}
.admin-table-wrap {
  overflow-x: auto;
  margin-bottom: 20px;
  border-radius: 12px;
  border: 1px solid #e8f0fe;
}
.admin-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
.admin-table th {
  background: #f5f9ff;
  color: #0063B3;
  padding: 11px 12px;
  text-align: left;
  font-weight: 600;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.4px;
  border-bottom: 2px solid #CFE2F3;
}
.admin-table td {
  padding: 11px 12px;
  border-bottom: 1px solid #eef2f7;
  color: #455a64;
  vertical-align: middle;
}
.admin-table tr:last-child td { border-bottom: none; }
.admin-table tr:hover td { background: #f8fafc; }
.badge {
  display: inline-block;
  padding: 4px 10px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 600;
}
.badge-pendente { background: #FDEBDD; color: #BA560B; }
.badge-aprovado { background: #E3F5EA; color: #00491B; }
.btn-sm {
  padding: 5px 12px;
  border: none;
  border-radius: 6px;
  font-size: 12px;
  cursor: pointer;
  font-weight: 500;
  transition: all 0.2s;
}
.btn-sm:hover { transform: translateY(-1px); }
.btn-ok { background: #0063B3; color: #fff; }
.btn-ok:hover { background: #003E73; }
.btn-deny { background: #DE001A; color: #fff; }
.btn-deny:hover { background: #730010; }
.sel-tipo {
  padding: 5px 8px;
  border-radius: 6px;
  border: 1px solid #c5cae9;
  background: #fff;
  color: #0063B3;
  font-size: 12px;
  cursor: pointer;
  outline: none;
}
.sel-tipo:focus { border-color: #3B8FD1; box-shadow: 0 0 0 2px rgba(66,165,245,0.15); }
.link-back {
  display: block;
  text-align: center;
  color: #3B8FD1;
  font-size: 13px;
  text-decoration: none;
  margin-top: 14px;
  cursor: pointer;
  font-weight: 500;
  transition: color 0.2s;
}
.link-back:hover { color: #003E73; text-decoration: underline; }
.empty-msg {
  text-align: center;
  color: #90a4ae;
  padding: 28px;
  font-size: 14px;
}

@media (max-width: 480px) {
  .card { margin: 16px; padding: 32px 24px 28px; border-radius: 20px; }
  .card h1 { font-size: 22px; }
}
</style>
</head>

(function () {
  const canvas = document.getElementById("particles");
  const ctx = canvas.getContext("2d");
  let w, h, pts;
  function resize() { w = canvas.width = innerWidth; h = canvas.height = innerHeight; }
  function init() {
    resize();
    const n = Math.max(30, Math.round((w * h) / 18000));

      x: Math.random() * w, y: Math.random() * h,

    }));
  }
  function draw() {
    ctx.clearRect(0, 0, w, h);

    }
    pts.forEach(p => {
      ctx.fillStyle = "rgba(144,202,249,0.6)";
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    });
    requestAnimationFrame(draw);
  }
  if (!matchMedia("(prefers-reduced-motion: reduce)").matches) { init(); draw(); window.addEventListener("resize", init); }
})();

/* ═══════════════ SUPABASE: tabela usuarios_acesso ═══════════════ */
const SB_HEADERS = {
  apikey: SUPABASE_ANON_KEY,
  Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
  "Content-Type": "application/json"
};
async function buscarUsuario(usuario) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/usuarios_acesso?usuario=eq.${encodeURIComponent(usuario)}&select=*`, { headers: SB_HEADERS });
  if (!res.ok) throw new Error(`Supabase GET ${res.status}`);
  const rows = await res.json();
  return rows[0] || null;
}
async function criarUsuario(row) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/usuarios_acesso`, {
    method: "POST",
    headers: { ...SB_HEADERS, Prefer: "return=representation" },
    body: JSON.stringify(row)
  });
  if (!res.ok) throw new Error(`Supabase POST ${res.status}`);
  const rows = await res.json();
  return rows[0];
}
async function atualizarUsuario(usuario, patch) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/usuarios_acesso?usuario=eq.${encodeURIComponent(usuario)}`, {
    method: "PATCH",
    headers: { ...SB_HEADERS, Prefer: "return=representation" },
    body: JSON.stringify({ ...patch, updated_at: new Date().toISOString() })
  });
  if (!res.ok) throw new Error(`Supabase PATCH ${res.status}`);
  const rows = await res.json();
  return rows[0];
}

/* ═══════════════ SESSÃO ═══════════════ */
function getSessao() {
  try { return JSON.parse(sessionStorage.getItem("cp_session") || "null"); } catch (e) { return null; }
}
function setSessao(s) { sessionStorage.setItem("cp_session", JSON.stringify(s)); }

// Se já existe sessão válida (< 8h), pula direto pro painel.
const sessaoAtual = getSessao();
if (sessaoAtual && sessaoAtual.ts && (Date.now() - sessaoAtual.ts) < 8 * 60 * 60 * 1000) {
  window.location.href = REDIRECT_TO;
}

/* ═══════════════ UI ═══════════════ */
const $ = id => document.getElementById(id);
const scrLogin = $("scrLogin"), scrPendente = $("scrPendente");
const usuarioEl = $("usuario"), senhaEl = $("senha"), btnEntrar = $("btnEntrar");
const statusLine = $("statusLine"), msgEl = $("msg");

function mostrar(tela) { [scrLogin, scrPendente].forEach(s => s.classList.remove("active")); tela.classList.add("active"); }
function showMsg(texto, tipo) { msgEl.textContent = texto; msgEl.className = "msg " + tipo; }
function clearMsg() { msgEl.className = "msg"; msgEl.textContent = ""; }
function setStatus(texto) { statusLine.innerHTML = texto ? '<span class="status-dot"></span>' + texto : ""; }
function resetBtn() { btnEntrar.disabled = false; btnEntrar.innerHTML = "<span>Entrar</span>"; }
function voltarLogin() { mostrar(scrLogin); usuarioEl.value = ""; senhaEl.value = ""; clearMsg(); setStatus(""); }

async function fazerLogin() {
  clearMsg();
  usuarioEl.classList.remove("err");
  senhaEl.classList.remove("err");

  const usuario = usuarioEl.value.trim().toLowerCase();
  const senha = senhaEl.value;

  if (!usuario || !senha) {
    if (!usuario) usuarioEl.classList.add("err");
    if (!senha) senhaEl.classList.add("err");
    showMsg("Informe usuário e senha para continuar.", "error");
    return;
  }

  btnEntrar.disabled = true;
  btnEntrar.innerHTML = '<span class="spinner"></span> Entrando…';
  setStatus("Conectando ao Senior…");

  try {
    const res = await fetch(SENIOR_LOGIN_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ usuario, senha })
    });
    const data = await res.json().catch(() => ({ autenticado: false, mensagem: "Resposta inválida do servidor." }));

    if (!data.autenticado) {
      setStatus("");
      showMsg(data.mensagem || "Usuário ou senha inválidos.", "error");
      senhaEl.classList.add("err");
      resetBtn();
      return;
    }

    setStatus("Verificando permissão de acesso…");
    const email = data.email || usuario;
    let registro;
    try {
      registro = await buscarUsuario(usuario);
    } catch (e) {
      console.error(e);
      setStatus("");
      showMsg("Login válido, mas não consegui checar sua permissão de acesso agora. Tente novamente.", "error");
      resetBtn();
      return;
    }

    const ehAdminFixo = ADMINS_FIXOS.includes(usuario);

    try {
      if (ehAdminFixo) {
        // admins fixos sempre passam pela função segura (usa a service role
        // key) — a policy de INSERT/UPDATE direta não libera mais
        // aprovado=true/tipo=admin pela chave pública, de propósito.
        const resp = await fetch(MANAGE_ACCESS_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action: "ensure-admin", target: usuario })
        });
        const data = await resp.json().catch(() => ({}));
        if (!data.ok) throw new Error(data.erro || "Falha ao provisionar acesso de administrador.");
        registro = data.registro;
      } else if (!registro) {
        // primeiro acesso de colaborador comum — sempre nasce pendente
        registro = await criarUsuario({ usuario, nome: email, email, tipo: null, aprovado: false });
      }
    } catch (e) {
      console.error(e);
      setStatus("");
      showMsg("Login válido, mas não consegui registrar sua permissão de acesso agora. Tente novamente.", "error");
      resetBtn();
      return;
    }

    if (!registro.aprovado) {
      mostrar(scrPendente);
      resetBtn();
      return;
    }

    setSessao({
      usuario, nome: registro.nome || email, email,
      tipo: registro.tipo || "individual",
      abrangencias: data.abrangencias || [],
      ts: Date.now()
    });

    setStatus("Acesso liberado — redirecionando…");
    setTimeout(() => { window.location.href = REDIRECT_TO; }, 500);
  } catch (err) {
    console.error(err);
    setStatus("");
    showMsg("Não foi possível contatar o serviço de autenticação. Tente novamente.", "error");
    resetBtn();
  }
}

senhaEl.addEventListener("keypress", e => { if (e.key === "Enter") fazerLogin(); });
usuarioEl.addEventListener("keypress", e => { if (e.key === "Enter") fazerLogin(); });
</script>
